include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - web/**
  language:
    strict-casts: false
    strict-raw-types: false
  errors:
    # Flutter 3.50 marks package:flutter/material.dart as deprecated in favour of
    # the experimental material_ui package. This project uses standard Flutter
    # Material, so the informational migration hint is intentionally muted.
    deprecated_member_use: ignore

linter:
  rules:
    always_use_package_imports: false
    prefer_single_quotes: true
    unnecessary_this: true
