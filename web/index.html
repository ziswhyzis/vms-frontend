<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Stark Group Vehicle Management System - fleet register for the Stark Group.">
  <meta name="theme-color" content="#F3E9DC">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">
  <title>Stark Group VMS</title>
  <style>
    @font-face {
      font-family: 'Nunito';
      src: url('assets/assets/fonts/Nunito-Regular.ttf') format('truetype');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Nunito';
      src: url('assets/assets/fonts/Nunito-SemiBold.ttf') format('truetype');
      font-weight: 600;
      font-display: swap;
    }
    @font-face {
      font-family: 'Nunito';
      src: url('assets/assets/fonts/Nunito-Bold.ttf') format('truetype');
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: 'Fraunces';
      src: url('assets/assets/fonts/Fraunces-Medium.ttf') format('truetype');
      font-weight: 500;
      font-display: swap;
    }
    body { background-color: #F3E9DC; margin: 0; }
    .boot-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background-color: #F3E9DC;
      background-image:
        linear-gradient(#E7E2D6, #E7E2D6),
        linear-gradient(#E7E2D6, #E7E2D6),
        linear-gradient(to bottom right, transparent calc(50% - 0.5px), #E7E2D6 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to bottom left, transparent calc(50% - 0.5px), #E7E2D6 50%, transparent calc(50% + 0.5px));
      background-size: 1px 120px, 120px 1px, 120px 120px, 120px 120px;
      background-position: 0 0, 0 0, 0 0, 0 0;
      font-family: 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;
      transition: opacity 240ms ease;
    }
    .boot-splash .mark {
      width: 64px; height: 64px; border-radius: 8px;
      background: linear-gradient(135deg, #9CAF88, #4F7C82);
      display: flex; align-items: center; justify-content: center;
      color: #F3E9DC; font-weight: 700; font-size: 22px; letter-spacing: 0.5px;
      font-family: 'Nunito', Georgia, sans-serif;
    }
    .boot-splash .name { color: #244043; font-size: 30px; font-weight: 500; font-family: 'Fraunces', Georgia, serif; }
    .boot-splash .sub { color: #4F7C82; font-size: 18px; font-weight: 500; }
  </style>
</head>
<body>
  <div class="boot-splash" id="boot-splash">
    <div class="mark">SG</div>
    <div class="name">Stark Group</div>
    <div class="sub">All in one space</div>
  </div>
  <script type="text/javascript" src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('boot-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function () { splash.remove(); }, 260);
      }
    });
  </script>
</body>
</html>
